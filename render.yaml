databases:
  - name: thehangover-db
    databaseName: hangover
    user: hangover
    plan: 0.1c-256mb
    region: singapore

envVarGroups:
  - name: thehangover-internal
    envVars:
      - key: ML_SERVICE_TOKEN
        generateValue: true

services:
  - type: pserv
    name: thehangover-ml
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: .
    plan: 1c-2g
    region: singapore
    disk:
      name: enjoyment-model
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - fromGroup: thehangover-internal
      - key: ENJOYMENT_MODEL_PATH
        value: /app/data/enjoyment.joblib

  - type: web
    name: thehangover-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thehangover-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          name: thehangover-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          name: thehangover-ml
          type: pserv
          property: hostport
      - fromGroup: thehangover-internal

  - type: web
    name: thehangover-frontend
    runtime: static
    buildCommand: npm ci && npm run build --workspace frontend
    staticPublishPath: ./frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        fromService:
          name: thehangover-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
